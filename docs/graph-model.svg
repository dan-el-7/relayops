<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">RelayOps FalkorDB graph model</title>
  <desc id="desc">Incident operations connect to services, tasks, runbooks, and handoffs. Current and previous memory revisions connect to categories, and the new revision supersedes the previous one. Tasks and handoffs store evidence snapshot IDs that are invalidated by fact corrections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:750;letter-spacing:-.4px}.sub{font-size:14px;fill:#64748b}
      .node{fill:#fff;stroke:#d9e1ed;stroke-width:1.5;filter:url(#shadow)}
      .nodeMem{fill:#f5f3ff;stroke:#c4b5fd}.nodeOps{fill:#f8fafc;stroke:#cbd5e1}.nodeOld{fill:#fff7ed;stroke:#fdba74}
      .name{font-size:17px;font-weight:700}.meta{font-size:12px;fill:#64748b}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .sup{fill:none;stroke:#7c3aed;stroke-width:2.5;marker-end:url(#arrowAccent)}
      .dash{fill:none;stroke:#d97706;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .edgeLabel{font-size:12px;font-weight:650;fill:#475569;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.supLabel{font-size:12px;font-weight:700;fill:#6d28d9;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
      .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}.panelTitle{font-size:14px;font-weight:750;fill:#334155}
      .panelText{font-size:12px;fill:#475569}.legend{font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#fff"/>
  <text x="42" y="52" class="title">RelayOps · FalkorDB graph model</text>
  <text x="42" y="78" class="sub">Persisted operations, evidence, and revision lineage in one tenant graph</text>

  <!-- Operational graph -->
  <path class="edge" d="M230 175 C280 130 320 130 370 175"/><text class="edgeLabel" x="285" y="135">AFFECTS</text>
  <path class="edge" d="M230 202 C290 245 310 285 370 315"/><text class="edgeLabel" x="276" y="268">HAS_TASK</text>
  <path class="edge" d="M230 220 C300 320 310 415 370 455"/><text class="edgeLabel" x="270" y="365">USES_RUNBOOK</text>
  <path class="edge" d="M230 190 C410 95 535 95 690 175"/><text class="edgeLabel" x="450" y="112">HAS_HANDOFF</text>
  <path class="edge" d="M550 315 C600 275 635 230 690 202"/><text class="edgeLabel" x="602" y="268">HANDOFF_FOR</text>

  <!-- Evidence and revision graph -->
  <path class="sup" d="M890 335 C950 305 985 245 1050 195"/><text class="supLabel" x="945" y="278">SUPERSEDES</text>
  <path class="edge" d="M800 395 C800 403 785 407 780 415"/><text class="edgeLabel" x="812" y="408">IN_CATEGORY</text>
  <path class="dash" d="M1050 220 C995 260 930 258 870 220"/><text class="edgeLabel" x="932" y="252">stales snapshot</text>

  <g><rect class="node nodeOps" x="70" y="155" width="160" height="80" rx="16"/><text class="name" x="94" y="188">Incident</text><text class="meta" x="94" y="211">synthetic incident</text></g>
  <g><rect class="node nodeOps" x="370" y="135" width="180" height="80" rx="16"/><text class="name" x="394" y="168">Service</text><text class="meta" x="394" y="191">affected component</text></g>
  <g><rect class="node nodeOps" x="370" y="275" width="180" height="80" rx="16"/><text class="name" x="394" y="308">Task</text><text class="meta" x="394" y="331">evidence snapshot IDs</text></g>
  <g><rect class="node nodeOps" x="370" y="415" width="180" height="80" rx="16"/><text class="name" x="394" y="448">Runbook</text><text class="meta" x="394" y="471">approved procedure</text></g>
  <g><rect class="node nodeOps" x="690" y="155" width="180" height="80" rx="16"/><text class="name" x="714" y="188">Handoff</text><text class="meta" x="714" y="211">evidence snapshot IDs</text></g>
  <g><rect class="node nodeOld" x="1050" y="155" width="120" height="80" rx="16"/><text class="name" x="1067" y="188">Old fact</text><text class="meta" x="1067" y="211">superseded</text></g>
  <g><rect class="node nodeMem" x="710" y="315" width="180" height="80" rx="16"/><text class="name" x="734" y="348">Current fact</text><text class="meta" x="734" y="371">searchable evidence</text></g>
  <g><rect class="node nodeMem" x="690" y="415" width="180" height="80" rx="16"/><text class="name" x="714" y="448">Category</text><text class="meta" x="714" y="471">one of eight topics</text></g>

  <rect class="panel" x="70" y="545" width="1100" height="105" rx="16"/>
  <text class="panelTitle" x="94" y="574">Correction gate</text>
  <text class="panelText" x="94" y="599">A correction creates a new fact revision and marks referencing task and handoff snapshots stale.</text>
  <text class="panelText" x="94" y="621">The next agent refreshes evidence before the action gate accepts simulated recovery.</text>
  <path class="dash" d="M820 588 L865 588"/><text class="legend" x="880" y="592">snapshot invalidation</text>
  <path class="sup" d="M820 619 L865 619"/><text class="legend" x="880" y="623">stored revision edge</text>
</svg>